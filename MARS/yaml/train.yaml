# Default training configuration read by streamlit_label_prep.py.
#
# These are the values the training widgets are pre-filled with; the app
# overwrites most of them from the UI and writes the settings a run actually
# used to Config.yaml inside that run's output directory. Treat that Config.yaml,
# not this file, as the record of what a given model was trained with.
#
# Paths below are placeholders relative to wherever you launch the app. Point
# them at your own data before training.
data_loader:
  batch_size: 39
  # DataLoader worker processes. 0 keeps loading in the main process, which is
  # the safe default under Streamlit on Windows, where workers re-import the app
  # module and need an "if __name__ == '__main__'" guard. Raising this speeds up
  # training noticeably when it works.
  num_workers: 0
gpu_config:
  gpu_name: 0
  use_gpu: true
output_size: 256
# Epochs per non-bone sampling stage. The trainer feeds 50% dirt patches for the
# first `period` epochs, then 30%, then 10%, then 0%.
period: 8
model:
  # Set if_pre_train true and point path at a .pth checkpoint to fine-tune from
  # an existing model instead of training from scratch.
  if_pre_train: false
  n_channels: 1
  class_num: 3
  path: null
optimizer:
  # AdaBelief tends to be steadier than Adam when gradients are noisy, which
  # suits small fine-tuning sets. 2e-4 is a fine-tuning rate; 5e-4 and above
  # behave like from-scratch rates and can pull a model away from pretrained
  # weights faster than it learns the new data.
  lr: 0.0002
  method: AdaBelief
  epsilon: 1.0e-16
  weight_decay: 1.0e-08
path:
  data_path: 'data/dataset.hdf5'
  save_path: 'data/new_model'
csv_path:
  train: 'data/patches.csv'
  val: 'data/val.csv'
  ratios: 'data/ratios.csv'
train_param:
  Epoch: 60
