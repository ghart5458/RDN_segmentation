[project]
name = "rdn-segmentation"
version = "1.0.0"
description = "RDN segmentation software for medical image analysis"
authors = [
    {name = "Nicholas B. Stephens", email = "nbs49@psu.edu"},
    {name = "Tim M. Ryan", email = "tmr21@psu.edu"},
    {name = "Vishal Monga", email = "vum4@psu.edu"},
]
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.8,<3.13"
dependencies = [
    # Core scientific computing
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.3.0",
    "pandas>=1.3.0",
    
    # Image processing and computer vision
    "pillow>=8.0.0",
    "opencv-python>=4.5.0",
    "scikit-image>=0.18.0",
    "imageio>=2.9.0",
    "albumentations>=1.0.0",
    "imgaug>=0.4.0",
    
    # Medical imaging
    "simpleitk>=2.1.0",
    
    # Deep learning (will be handled by optional dependencies)
    # PyTorch ecosystem handled below with custom sources
    
    # Data handling
    "h5py>=3.1.0",
    "tqdm>=4.60.0",
    "pyyaml>=5.4.0",
    
    # Web interface
    "streamlit>=1.0.0",
    "plotly>=5.0.0",
    
    # 3D processing and visualization
    "pyvista>=0.32.0",
    "vtk>=9.0.0",
    "pymeshfix>=0.16.0",
    "tetgen>=0.6.0",
    "shapely>=1.7.0",
    
    # Scientific computation
    "networkx>=2.5.0",
    
    # Jupyter support
    "jupyter>=1.0.0",
    "notebook>=6.4.0",
    "ipykernel>=6.0.0",
    
    # Additional utilities
    "requests>=2.25.0",
    "protobuf>=3.17.0",
    "connected-components-3d>=3.10.0",
    "pywavelets>=1.1.0",
    
    # Development tools (optional in base, can be moved to dev group)
    "setuptools>=50.0.0",
    "wheel>=0.36.0",
]

[project.optional-dependencies]
# PyTorch CPU-only build
cpu = [
    "torch>=1.7.0,<2.0.0",
    "torchvision>=0.8.0,<1.0.0",
    "tensorboard>=2.4.0",
]

# PyTorch CUDA build (recommended for training)
cuda = [
    "torch>=1.7.0,<2.0.0",
    "torchvision>=0.8.0,<1.0.0",
    "tensorboard>=2.4.0",
]

# Development dependencies
dev = [
    "pytest>=6.0.0",
    "black>=21.0.0",
    "flake8>=3.8.0",
    "mypy>=0.800",
]

# Special dependencies that need git installation
git-deps = [
    # pytorch_wavelets will be handled separately via install script
    "adabelief-pytorch==0.2.1",
]

[project.urls]
Homepage = "https://github.com/femr-lab/RDN_segmentation"
Repository = "https://github.com/femr-lab/RDN_segmentation"
Documentation = "https://github.com/femr-lab/RDN_segmentation/blob/main/README.md"

# uv-specific configuration
[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cuda" }],
]

# Configure PyTorch sources for different platforms and accelerators
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda118", extra = "cuda", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda118", extra = "cuda", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

# PyTorch index configuration
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true