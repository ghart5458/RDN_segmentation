[project]
name = "rdn-segmentation"
version = "1.0.0"
description = "RDN segmentation software for medical image analysis"
authors = [
    {name = "Nicholas B. Stephens", email = "nbs49@psu.edu"},
    {name = "Tim M. Ryan", email = "tmr21@psu.edu"},
    {name = "Vishal Monga", email = "vum4@psu.edu"},
]
readme = "README.md"
license = "GPL-3.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Core scientific computing
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.3.0",
    "pandas>=1.3.0",
    
    # Image processing and computer vision
    "pillow>=8.0.0",
    "opencv-python>=4.5.0",
    "scikit-image>=0.18.0",
    "imageio>=2.9.0",
    "albumentations>=1.0.0",
    "imgaug>=0.4.0",
    
    # Medical imaging
    "simpleitk>=2.1.0",
    
    # Deep learning - CUDA-enabled PyTorch (required)
    "torch>=2.5.0,<2.6.0",
    "torchvision>=0.20.0,<0.21.0",
    "tensorboard>=2.15.0",
    
    # Data handling
    "h5py>=3.1.0",
    "tqdm>=4.60.0",
    "pyyaml>=5.4.0",
    
    # Web interface
    "streamlit>=1.0.0",
    "plotly>=5.0.0",
    
    # 3D processing and visualization
    "pyvista>=0.32.0",
    "vtk>=9.0.0",
    "pymeshfix>=0.16.0",
    "tetgen>=0.6.0",
    "shapely>=1.7.0",
    
    # Scientific computation
    "networkx>=2.5.0",
    
    # Jupyter support
    "jupyter>=1.0.0",
    "notebook>=6.4.0",
    "ipykernel>=6.0.0",
    
    # Additional utilities
    "requests>=2.25.0",
    "protobuf>=3.17.0",
    "connected-components-3d>=3.10.0",
    "pywavelets>=1.1.0",
    
    # Development tools (optional in base, can be moved to dev group)
    "setuptools>=50.0.0",
    "wheel>=0.36.0",
]

[project.optional-dependencies]

# Development dependencies
dev = [
    "pytest>=6.0.0",
    "ruff>=0.1.0",
    "mypy>=0.800",
]

# Special dependencies that need git installation
git-deps = [
    # pytorch_wavelets will be handled separately via install script
    "adabelief-pytorch==0.2.1",
]

[project.urls]
Homepage = "https://github.com/femr-lab/RDN_segmentation"
Repository = "https://github.com/femr-lab/RDN_segmentation"
Documentation = "https://github.com/femr-lab/RDN_segmentation/blob/main/README.md"

# uv-specific configuration
[tool.uv.sources]
torch = { index = "pytorch-cuda124" }
torchvision = { index = "pytorch-cuda124" }

# PyTorch CUDA index configuration
[[tool.uv.index]]
name = "pytorch-cuda124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["MARS", "Scripts"]
include-package-data = true

[tool.setuptools.package-dir]
"" = "."

# Ruff configuration (replaces black, flake8, isort)
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate (commented code)
    "PL",   # pylint
    "TRY",  # tryceratops
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "PLR0913", # too many arguments
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "TRY003", # avoid specifying long messages outside exception class
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"Scripts/*.py" = ["T201"]  # print statements allowed in scripts
"MARS/streamlit_apps/*.py" = ["T201"]  # print statements allowed in streamlit apps

[tool.ruff.format]
line-ending = "auto"
indent-style = "space"
quote-style = "double"
docstring-code-format = true
docstring-code-line-length = 80

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

# Add newline at end of file